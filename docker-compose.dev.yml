##############################################################################
# docker-compose.dev.yml — Local Development Environment
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build       # Start with rebuild
#   docker compose -f docker-compose.dev.yml up               # Start (cached)
#   docker compose -f docker-compose.dev.yml down              # Stop & remove
#   docker compose -f docker-compose.dev.yml down -v --rmi local  # Full cleanup
#
# Notes:
#   - Mounts ./src as a volume for live code reloading
#   - Uses uvicorn --reload for hot-reload on file changes
#   - Reads environment from .env (create from .env.example)
#   - Optionally mounts GCP ADC for Vertex AI access
##############################################################################

services:
  tracerlensai-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tracerlensai-dev:latest
    container_name: tracerlensai-dev
    user: "root"
    ports:
      - "8080:8080"

    # Override the production CMD with hot-reload for development
    command: >
      uvicorn src.fast_api_app:app --host 0.0.0.0 --port 8080 --reload --reload-dir /app/src

    # Mount source code for live editing (overrides the COPY in Dockerfile)
    volumes:
      - ./src:/app/src:ro
      - ~/.config/gcloud/application_default_credentials.json:/tmp/adc.json:ro

    # Load environment from .env file (create from .env.example)
    env_file:
      - .env
    
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - GOOGLE_CLOUD_PROJECT=icarus-agent-26
      - GOOGLE_CLOUD_LOCATION=us-central1
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
      - PYTHONPATH=/home/tracerlensaiuser/.local/lib/python3.12/site-packages:/app

    # Health check matching the production readiness probe
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped

  # ── Test Runner ───────────────────────────────────────────────────────────
  # One-shot container for running tests (not started by default)
  test-runner:
    image: tracerlensai-dev:latest
    container_name: tracerlensai-test
    profiles:
      - test # Only runs when explicitly requested via --profile test
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./.flake8:/app/.flake8:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=test
    # Default: run the full test suite.  Overridden per-step in run_tests.sh
    command: python -m pytest tests/ --ignore=tests/ui_tests -v --tb=short

  # ── Causal Agent UI Test Runner ───────────────────────────────────────────
  causal-agent-ui-test:
    image: mcr.microsoft.com/playwright/python:v1.44.0-jammy
    container_name: tracerlensai-causal-ui-test
    profiles:
      - ui-test
    volumes:
      - ./tests/ui_tests:/app/tests/ui_tests:ro
      - ./requirements.txt:/app/requirements.txt:ro
    working_dir: /app
    depends_on:
      tracerlensai-app:
        condition: service_healthy
    command: >
      bash -c "grep -v 'google-agents-cli' requirements.txt > req-ui.txt && pip install -r req-ui.txt && python -m pytest tests/ui_tests/test_ui.py -v --tb=short"
