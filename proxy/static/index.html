<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TracerLensAi: AI Agentic Workflow Evaluator</title>
    <script>
        // Apply the saved theme before first paint to avoid a flash.
        (function () {
            var theme = null;
            try { theme = localStorage.getItem("tracerlens-theme"); } catch (e) { /* storage blocked */ }
            document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
        })();
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script>
        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({
                startOnLoad: false,
                securityLevel: 'strict',
                theme: document.documentElement.getAttribute('data-theme') === 'light' ? 'neutral' : 'dark'
            });
        }
    </script>
    <link rel="stylesheet" href="styles.css?v=4">
</head>

<body>
    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span class="logo-mark" aria-hidden="true">
                    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
                        <defs>
                            <linearGradient id="brand-grad" x1="0" y1="0" x2="30" y2="30">
                                <stop offset="0" stop-color="#22d3ee" />
                                <stop offset="1" stop-color="#8b5cf6" />
                            </linearGradient>
                        </defs>
                        <circle cx="15" cy="15" r="11" stroke="url(#brand-grad)" stroke-width="2.4" />
                        <circle cx="15" cy="15" r="4" fill="url(#brand-grad)" />
                        <path d="M15 1.5v6M15 22.5v6M1.5 15h6M22.5 15h6" stroke="url(#brand-grad)" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </span>
                <span class="brand-name">TracerLens<span class="brand-ai">Ai</span></span>
            </div>
            <div class="tracer-line" aria-hidden="true"></div>

            <button class="new-chat-btn" id="new-chat-btn"><span class="plus">+</span> New chat</button>

            <nav class="history" aria-label="Recent workflows">
                <div class="history-title">Recent workflows</div>
                <div id="history-items">
                    <div class="history-item hint" id="history-empty-hint">Sign in to see your saved workflows</div>
                </div>
            </nav>

            <div class="sidebar-foot">
                <span>TracerLensAi</span><span>causal agent</span>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <header class="chat-header">
                <button class="menu-btn" id="toggle-sidebar" aria-label="Toggle sidebar">☰</button>
                <div class="chat-title">Causal Agent <span class="status-dot" aria-hidden="true"></span></div>
                <span class="token-badge" id="token-tally-badge">0 tokens used</span>

                <div class="header-controls">
                    <select class="model-select" id="model-select" aria-label="Model">
                        <option value="gemini-2.5-flash" selected>gemini-2.5-flash</option>
                        <option value="gemini-2.5-pro">gemini-2.5-pro</option>
                    </select>
                    <label class="switch-group"><span class="sw-label">Causal</span>
                        <span class="switch">
                            <input type="checkbox" id="causal-toggle" aria-label="Causal reasoning">
                            <span class="track"></span>
                        </span>
                    </label>
                    <label class="switch-group" title="Add observation data from the web"><span class="sw-label">Web data</span>
                        <span class="switch">
                            <input type="checkbox" id="web-search-toggle" aria-label="Add observation data from the web">
                            <span class="track"></span>
                        </span>
                    </label>
                    <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">☾</button>
                    <button class="signin-btn" id="sign-in-btn">Sign in with Google</button>
                    <div class="user-chip" id="user-chip">
                        <img id="user-avatar" alt="" referrerpolicy="no-referrer">
                        <span id="user-name"></span>
                        <button id="sign-out-btn">Sign out</button>
                    </div>
                </div>
            </header>

            <div class="messages" id="messages-area">
                <div class="messages-inner" id="messages-inner"></div>
            </div>

            <div class="composer">
                <div class="composer-inner">
                    <div class="chips-row" id="attachment-chips"></div>
                    <div class="input-pill">
                        <button class="attach-btn" id="attach-btn" aria-label="Attach files" title="Attach files">+</button>
                        <input type="file" id="file-input" multiple hidden
                            accept=".txt,.md,.markdown,.csv,.tsv,.json,.yaml,.yml,.toml,.xml,.html,.css,.js,.ts,.py,.java,.go,.rs,.c,.cpp,.h,.sh,.sql,.log">
                        <textarea id="chat-input" rows="1"
                            placeholder="Ask about cause and effect… (Enter to send, Shift+Enter for newline)"></textarea>
                        <button class="send-btn" id="send-btn" aria-label="Send">➤</button>
                    </div>
                    <div class="disclaimer">Agent evaluations are simulated dry-run predictions.</div>
                </div>
            </div>

            <div class="drop-overlay" id="drop-overlay">
                <div class="drop-inner">
                    <div class="drop-icon">⤓</div>
                    <h2>Drop files to attach</h2>
                    <p>.txt · .md · .csv · .json · code — up to 5 MB</p>
                </div>
            </div>
        </main>
    </div>

    <!-- API base for backend calls. Empty = same-origin (through Firebase
         Hosting). Set to the Cloud Run direct URL to bypass Hosting's 60s
         timeout on long causal runs. Must load before causal-agent.js. -->
    <script>window.TRACERLENS_API_BASE = "https://tracerlensai-app-gi2oexvg3a-nw.a.run.app";</script>
    <script src="causal-agent.js?v=4"></script>

    <!-- Firebase SDK Configuration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
        import {
            getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHUmpsoO9veaAjAlwYLRyCiguJ1iisb-k",
            authDomain: "icarus-agent-26.firebaseapp.com",
            projectId: "icarus-agent-26",
            storageBucket: "icarus-agent-26.firebasestorage.app",
            messagingSenderId: "463466170878",
            appId: "1:463466170878:web:f94935748b3f12f15298af",
            measurementId: "G-47JZT25Q8S"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        // ── Auth bridge for causal-agent.js (non-module script) ──
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const listeners = [];
        let currentUser = null;

        window.tracerAuth = {
            getIdToken: () => currentUser ? currentUser.getIdToken() : Promise.resolve(null),
            onChange: (cb) => { listeners.push(cb); cb(currentUser); },
            signIn: () => signInWithPopup(auth, provider).catch(err => console.error("Sign-in failed:", err)),
            signOut: () => signOut(auth),
        };

        const signInBtn = document.getElementById("sign-in-btn");
        const userChip = document.getElementById("user-chip");
        const userAvatar = document.getElementById("user-avatar");
        const userName = document.getElementById("user-name");

        signInBtn.addEventListener("click", () => window.tracerAuth.signIn());
        document.getElementById("sign-out-btn").addEventListener("click", () => window.tracerAuth.signOut());

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                signInBtn.style.display = "none";
                userChip.style.display = "flex";
                userAvatar.src = user.photoURL || "";
                userName.textContent = user.displayName || user.email || "";
            } else {
                signInBtn.style.display = "";
                userChip.style.display = "none";
            }
            listeners.forEach(cb => cb(user));
        });
    </script>
</body>

</html>
