# =============================================================================
# deploy.yml — CD: one-step deployment of the TracerLensAi stack
#
# Trigger : push to main — i.e. every merge into main (full pipeline), or
#           manual dispatch with an optional single stage.
# Pipeline: deploy_to_gcp.sh →
#   1. Vertex AI Agent Engine (src/ via agents-cli, in-place update)
#   2. Cloud Run proxy `tracerlensai-app` (proxy/ via Dockerfile.proxy)
#   3. Firebase Hosting (proxy/static + rewrites → Cloud Run)
# A GitHub Deployment is recorded against the production environment,
# linking the run to the live app at https://tracerlensai.com.
# =============================================================================
name: "CD — Deploy to GCP"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - agent
          - proxy
          - hosting

env:
  PROJECT_ID: 'icarus-agent-26'
  REGION: 'europe-west2'
  APP_URL: 'https://tracerlensai.com'

jobs:
  deploy:
    name: "Deploy Agent Engine → Cloud Run → Firebase Hosting"
    runs-on: ubuntu-latest

    # id-token: Workload Identity Federation. deployments: GitHub Deployment
    # record linking the run to https://tracerlensai.com.
    permissions:
      contents: 'read'
      id-token: 'write'
      deployments: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
              description: 'TracerLensAi: Agent Engine + Cloud Run + Firebase Hosting',
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ vars.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agents-cli
        # agents-cli shells out to uv when packaging the agent source
        run: pip install uv google-agents-cli

      - name: Create .env for deploy_to_gcp.sh
        # AGENT_ENGINE_ENDPOINT is intentionally not set here: the script
        # derives it from deployment_metadata.json, which agents-cli keeps
        # current (the old repo-level var went stale and broke the proxy).
        run: |
          echo "GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}" > .env
          echo "GOOGLE_CLOUD_REGION=${{ env.REGION }}" >> .env

      - name: Deploy
        id: deploy
        continue-on-error: true
        # Access-gate configuration (docs/access_control.md). deploy_to_gcp.sh
        # forwards each of these to Cloud Run only when non-empty, so an
        # unconfigured secret leaves the service's current value alone rather
        # than blanking it. Set the secrets in the repo before the first
        # deploy: without ACCESS_SIGNING_SECRET every cold start signs all
        # visitors out, and without ADMIN_TOKEN /admin answers 503.
        env:
          ACCESS_SIGNING_SECRET: ${{ secrets.ACCESS_SIGNING_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ACCESS_NOTIFY_EMAIL: ${{ vars.ACCESS_NOTIFY_EMAIL }}
          ACCESS_FROM_EMAIL: ${{ vars.ACCESS_FROM_EMAIL }}
          APP_URL: ${{ env.APP_URL }}
        run: |
          chmod +x deploy_to_gcp.sh
          set +e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.stage }}" != "all" ]; then
            ./deploy_to_gcp.sh --only "${{ github.event.inputs.stage }}" 2>&1 | tee deploy.log
          else
            ./deploy_to_gcp.sh 2>&1 | tee deploy.log
          fi
          rc=${PIPESTATUS[0]}
          # Surface the failure in the run's annotations, which are visible
          # without repo admin access (job logs are not).
          if [ "$rc" -ne 0 ]; then
            echo "::error title=deploy_to_gcp.sh failed (exit $rc)::$(tail -c 700 deploy.log | tr '\n' ' ')"
          fi
          exit $rc

      - name: Update GitHub deployment status
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.deployment_id }}
          APP_URL: ${{ env.APP_URL }}
        with:
          script: |
            const state = process.env.DEPLOY_OUTCOME === 'success' ? 'success' : 'failure';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state,
              environment_url: process.env.APP_URL,
              description: state === 'success'
                ? 'Deployed successfully'
                : 'Deployment failed — see run annotations',
            });

      - name: Fail job if deploy failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
