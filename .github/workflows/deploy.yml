# =============================================================================
# deploy.yml — CD: one-step deployment of the TracerLensAi stack
#
# Trigger : push to gemini-agent-platform (full pipeline), or manual dispatch
#           with an optional single stage.
# Pipeline: deploy_to_gcp.sh →
#   1. Vertex AI Agent Engine (src/ via agents-cli, in-place update)
#   2. Cloud Run proxy `tracerlensai-app` (proxy/ via Dockerfile.proxy)
#   3. Firebase Hosting (proxy/static + rewrites → Cloud Run)
# =============================================================================
name: "CD — Deploy to GCP"

on:
  push:
    branches:
      - gemini-agent-platform
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - agent
          - proxy
          - hosting

env:
  PROJECT_ID: 'icarus-agent-26'
  REGION: 'europe-west2'

jobs:
  deploy:
    name: "Deploy Agent Engine → Cloud Run → Firebase Hosting"
    runs-on: ubuntu-latest

    # Required for Workload Identity Federation (OIDC)
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ vars.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agents-cli
        run: pip install google-agents-cli

      - name: Create .env for deploy_to_gcp.sh
        run: |
          echo "GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}" > .env
          echo "GOOGLE_CLOUD_REGION=${{ env.REGION }}" >> .env
          echo "AGENT_ENGINE_ENDPOINT=${{ vars.AGENT_ENGINE_ENDPOINT }}" >> .env

      - name: Deploy
        run: |
          chmod +x deploy_to_gcp.sh
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.stage }}" != "all" ]; then
            ./deploy_to_gcp.sh --only "${{ github.event.inputs.stage }}"
          else
            ./deploy_to_gcp.sh
          fi
