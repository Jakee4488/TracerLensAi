# =============================================================================
# ci.yml — Pull Request CI
#
# Triggers: every pull_request targeting main
# Jobs    : pytest (backend), then UI lint/typecheck/build + the Playwright E2E
#           suite against a mock-mode proxy
# Purpose : Gate PRs — must pass before merge is allowed
#
# The E2E suite runs here because excluding it is how the access gate broke
# unnoticed: mail was unconfigured in production, every /auth/login answered
# 502, and no visitor could sign in. tests/ui_tests covers exactly that path
# (request → approve → session) and fails loudly on it, but was skipped in CI.
# It needs no credentials — proxy/access.py's ACCESS_MAIL_TRANSPORT=console
# prints each message, and the suite reads its sign-in links back out of the
# server log.
#
# Two dependency-drift guards, added after an incident where `a2a-sdk`'s
# unbounded `>=0.3.22` pin floated onto a breaking 1.x release during
# `agents-cli deploy`'s own fresh dependency resolve (independent of this
# repo's lockfile) and crash-looped the deployed container on startup:
#
#   - "Verify uv.lock matches pyproject.toml" (uv lock --check) catches
#     pyproject.toml/uv.lock drift — e.g. a constraint edited without
#     regenerating the lock. This does NOT reproduce the actual incident:
#     agents-cli ignores this repo's lockfile entirely when it packages the
#     agent bundle, so an in-sync lockfile does not guarantee agents-cli
#     resolves the same versions.
#   - tests/test_app_entrypoint.py imports src/fast_api_app.py — the real
#     production ASGI entrypoint — under the same unpinned `pip install -r
#     requirements.txt` this job already runs. Every other test in this suite
#     only touches src.agent/src.causal (credential-free by design; see
#     src/__init__.py), so this was the actual gap: nothing previously
#     exercised the import chain that broke in production.
# =============================================================================
name: "CI — Pull Request Checks"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test_pipeline:
    name: "Full Test Pipeline"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        run: pip install uv

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Backend only: the E2E suite serves ui/dist, which does not exist until
      # the Build UI step below, so it runs as its own step further down.
      - name: Run backend tests
        run: python -m pytest tests/ --ignore=tests/ui_tests -v --tb=short

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Lint and typecheck UI
        run: npm run lint && npm run typecheck
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui

      # requirements.txt covers the agent, not the proxy the E2E suite boots.
      - name: Install UI test dependencies
        run: pip install -r requirements-proxy.txt -r requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run UI tests
        run: python -m pytest tests/ui_tests -v --tb=short
