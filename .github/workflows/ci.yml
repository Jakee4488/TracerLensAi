# =============================================================================
# ci.yml — Pull Request CI
#
# Triggers: every pull_request targeting main
# Jobs    : run_tests.sh test
# Purpose : Gate PRs — must pass before merge is allowed
# =============================================================================
name: "CI — Pull Request Checks"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test_pipeline:
    name: "Full Test Pipeline"
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_REGION:  ${{ vars.GOOGLE_CLOUD_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file for run_tests.sh
        run: |
          echo "GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}" > .env
          echo "GOOGLE_CLOUD_REGION=${GOOGLE_CLOUD_REGION}" >> .env

      - name: Run Test Pipeline
        run: ./run_tests.sh test
