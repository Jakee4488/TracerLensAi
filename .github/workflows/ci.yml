# =============================================================================
# ci.yml — Pull Request CI
#
# Triggers: every pull_request targeting main
# Jobs    : pytest (backend suite; UI tests excluded — they need a live stack)
# Purpose : Gate PRs — must pass before merge is allowed
# =============================================================================
name: "CI — Pull Request Checks"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test_pipeline:
    name: "Full Test Pipeline"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ --ignore=tests/ui_tests -v --tb=short

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Lint and typecheck UI
        run: npm run lint && npm run typecheck
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui
