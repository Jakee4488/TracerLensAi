name: "CD — Deploy to GCP"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment Target'
        required: true
        default: 'cloudrun'
        type: choice
        options:
          - cloudrun
          - gke

env:
  PROJECT_ID: ${{ vars.GOOGLE_CLOUD_PROJECT }}
  REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
  IMAGE_NAME: gcr.io/${{ vars.GOOGLE_CLOUD_PROJECT }}/tracerlensai-app

jobs:
  deploy:
    name: "Build and Deploy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        if: ${{ github.event.inputs.target == 'cloudrun' || (github.event_name == 'push' && vars.DEFAULT_TARGET == 'cloudrun') }}
        run: |
          gcloud run deploy tracerlensai-app \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated

      - name: Deploy to GKE
        if: ${{ github.event.inputs.target == 'gke' || (github.event_name == 'push' && vars.DEFAULT_TARGET == 'gke') }}
        run: |
          gcloud container clusters get-credentials my-cluster --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }}
          helm upgrade --install tracerlensai ./helm/tracerlensai \
            --set image.tag=${{ github.sha }} \
            --set env.GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }} \
            --set env.GOOGLE_CLOUD_REGION=${{ env.REGION }}
